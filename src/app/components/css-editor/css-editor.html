<div class="css-editor">

    <div class="css-editor__header">
        <div class="css-editor__title">
            <img class="css-editor__icon" src="./assets/icons/code-solid-full.svg" alt="code icon" />
            <h3>Generated CSS</h3>
        </div>

        <div class="css-editor__actions">
            <button (click)="changeTab(true)" class="css-editor__language-tab"><span [class]="cssTabOpened() ? 'highlight' : 'css-editor__language'"  class="">CSS</span></button>
            <button (click)="changeTab(false)" class="css-editor__language-tab"><span [class]="!cssTabOpened() ? 'highlight' : 'css-editor__language'">HTML</span></button>


            <button class="css-editor__copy" (click)="copyCSS(cssTabOpened())" type="button">
                <img src="./assets/icons/copy-regular-full.svg" alt="copy icon" />
                Copy
            </button>
        </div>
    </div>

    <div class="css-editor__body">

        @if (cssTabOpened()) {
        <textarea class="css-editor__textarea" [value]="cssCode()" readonly spellcheck="false"
            aria-label="Generated CSS code">
        </textarea>
        }@else{
        <textarea class="css-editor__textarea" [value]="htmlCode()" readonly spellcheck="false"
            aria-label="Generated HTML code">
        </textarea>
        }

    </div>

    <div class="css-editor__footer">
        @if (cssTabOpened()) {
        <span>CSS generated automatically</span>
        <span>
            @if (cssCode() === '') {
            0
            }@else{
            {{ cssCode().split('\n').length }}
            }
            lines
        </span>
        }@else {
        <span>HTML generated automatically</span>
        <span>
            @if (htmlCode() === '') {
            0
            }@else{
            {{ htmlCode().split('\n').length }}
            }
            lines
        </span>
        }
    </div>

</div>
