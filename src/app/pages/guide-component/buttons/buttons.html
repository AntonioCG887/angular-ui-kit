<section class="main-content">

    <app-component-examples componentDesc="Essential for user interactions" componentType="Buttons">

        <section class="component-content">
            <h2>Results in real time</h2>
            <button [style]="selectedStyleInline()">Results</button>
        </section>
        <section class="component-content">
            <h2>Variants</h2>
            <p>Explore diffetent styles</p>
            <button class="primary">Primary</button>
            <button class="secondary">Secondary</button>
            <button class="outline">Outline</button>
            <button class="danger">Danger</button>
            <button class="success">Success</button>
            <button class="warning">Warning</button>
            <button class="ghost">Ghost</button>
        </section>

        <section class="component-content">
            <h2>Sizes</h2>
            <button class="primary small">Small</button>
            <button class="primary medium">Medium</button>
            <button class="primary large">Large</button>
        </section>

        <section class="component-content">
            <h2>States</h2>
            <p>See how buttons behave</p>
            <button class="primary">Normal</button>
            <button class="disabled">Disabled</button>
            <button class="outline focus">Focus</button>
        </section>

    </app-component-examples>

    <section app-customizer class="customizer" title="Customize your button" cssCode={{selectedStyle()}} htmlCode={{htmlCode()}}>
        <div>
            <p>Variant</p>
            <button class="primary" (click)="setStyle(0)">Primary</button>
            <button class="secondary" (click)="setStyle(1)">Secondary</button>
            <button class="outline" (click)="setStyle(2)">Outline</button>
            <button class="danger" (click)="setStyle(3)">Danger</button>
            <button class="success" (click)="setStyle(4)">Success</button>
            <button class="warning" (click)="setStyle(5)">Warning</button>
            <button class="ghost" (click)="setStyle(6)">Ghost</button>
        </div>
        <div>
            <p>Size</p>
            <button class="primary small" (click)="changeSize('s')">Small</button>
            <button class="primary medium" (click)="changeSize('m')">Medium</button>
            <button class="primary large" (click)="changeSize('l')">Large</button>
        </div>
        <div>
            <p>Border Radius (px)</p>
            <div class="customizer__input-group">
                <input type="number"  value="{{currentRadius()}}"  [(ngModel)]="currentRadius"/>
                <input type="range" min="0" max="100" step="1" value="{{currentRadius()}}" class="slider" id="radiusRange" [(ngModel)]="currentRadius"  />
                <button (click)="resetPropertyToDefault('border-radius:')"><img src="./assets/icons/rotate-left-solid-full.svg" alt="reset icon" /></button>
            </div>
        </div>
        <div>
            <p>Padding (px)</p>
            <div class="customizer__input-group">
                <input type="number" value="{{currentPadding()}}" [(ngModel)]="currentPadding" />
                <input type="range" min="0" max="100" step="1" value="{{currentPadding()}}"  class="slider" id="radiusRange" [(ngModel)]="currentPadding"/>
                <button (click)="resetPropertyToDefault('padding:')"><img src="./assets/icons/rotate-left-solid-full.svg" alt="reset icon" /></button>
            </div>
        </div>
        <div class="customizer__color-pick">
            <span>Text Color</span>
            <input type="color"[(ngModel)]="textColor" />
            <input type="text" [(ngModel)]="textColor"/>
            <button (click)="resetPropertyToDefault('color:')"><img src="./assets/icons/rotate-left-solid-full.svg" alt="reset icon" /></button>
        </div>
        <div class="customizer__color-pick">
            <span>Background Color</span>
            <input type="color" [(ngModel)]="bgColor" />
            <input type="text" [(ngModel)]="bgColor" />
            <button (click)="resetPropertyToDefault('background:')"><img src="./assets/icons/rotate-left-solid-full.svg" alt="reset icon" /></button>
        </div>
    </section>

</section>
